<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Prototype, vue téléphones</title>
<style>
body { margin: 0; background: #1b1d22; color: #ddd; font: 14px system-ui, sans-serif; }
.row { display: flex; justify-content: center; align-items: flex-start; gap: 30px; padding: 16px 24px 0; flex-wrap: wrap; }
figure { margin: 0; text-align: center; }
iframe { height: 600px; border: 10px solid #000; border-radius: 36px; background: #000; }
figcaption { margin-top: 6px; }
a { color: #9cf; }
</style>
</head>
<body>
<div class="row">
    <figure><iframe src="prototype.html" style="width:340px" title="E, 320 px"></iframe><figcaption>Petit téléphone, 320 px</figcaption></figure>
    <figure><iframe src="prototype.html" style="width:410px" title="E, 390 px"></iframe><figcaption>Téléphone courant, 390 px</figcaption></figure>
    <figure><iframe src="prototype.html" style="width:450px" title="E, 430 px"></iframe><figcaption>Grand téléphone, 430 px (<a href="prototype.html">version bureau</a>)</figcaption></figure>
</div>
<script>
if (location.search) document.querySelectorAll('iframe').forEach(f => { f.src = 'prototype.html' + location.search; });
</script>
</body>
</html>
