<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maquette S8, compétences</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="mockup-skills.css">
<link rel="stylesheet" href="mockup-projects.css">
</head>
<body>
<header class="bar">
    <span class="brand"><i></i><span id="brand"></span></span>
    <nav class="nav" id="nav"></nav>
</header>
<main>
    <section class="view on" id="skills">
        <h2 id="sTitle2" tabindex="-1"></h2>
        <p class="lede" id="sLede"></p>
        <div class="skills-layout" id="skillsLayout">
            <div class="viz-wrap">
                <svg class="viz const" id="constSvg" role="group"></svg>
                <p class="hint" id="hint"></p>
            </div>
            <div class="focus-panel hud" id="focusPanel">
                <button class="back" id="back" type="button"></button>
                <p class="ctitle" id="cTitle"></p>
                <div class="chips" id="chips" role="group"></div>
                <article class="hud detail skill" id="skill" aria-live="polite">
                    <header>
                        <div>
                            <h3 id="kName"></h3>
                            <span class="lvl" id="kLvl"></span>
                        </div>
                        <div class="arrows">
                            <button id="kPrev" type="button">&#8592;</button>
                            <button id="kNext" type="button">&#8594;</button>
                        </div>
                    </header>
                    <div class="body" id="kDesc"></div>
                    <div class="related" id="kRel"></div>
                </article>
            </div>
        </div>
        <div class="legend" id="legend"></div>
    </section>
    <section class="view" id="projects">
        <h2 id="pHead" tabindex="-1"></h2>
        <p class="lede" id="pLede"></p>
        <div class="sys-layout" id="sysLayout">
            <div class="sys-plan">
                <div class="sys-head" id="sysHead">
                    <button class="back" id="sysBack" type="button"></button>
                    <p class="ctitle" id="sysHeadTitle"></p>
                    <span class="count" id="sysHeadCount"></span>
                </div>
                <svg class="systems" id="systems" role="group"></svg>
            </div>
        </div>
    </section>
</main>
<nav class="tabbar" id="tabbar"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <button class="close" id="close" type="button">&#215;</button>
    <span class="cat" id="sCat"></span>
    <h3 id="sTitle"></h3>
    <ul class="tags" id="sTags"></ul>
    <div class="body" id="sBody"></div>
</aside>
<script src="mockup-core.js"></script>
<script src="mockup-art.js"></script>
<script src="mockup-skills.js"></script>
<script src="mockup-projects.js"></script>
<script src="mockup-flow.js"></script>
<script src="mockup-measure.js"></script>
<script src="mockup.js"></script>
</body>
</html>
