<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests navigateur du portfolio</title>
    <style>
        body {
            margin: 1rem;
            font: 14px/1.4 system-ui, sans-serif;
            color: #111;
            background: #fff;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0 0 .5rem;
        }

        #summary {
            font-size: 1.1rem;
            font-weight: 600;
            padding: .5rem .75rem;
            border-radius: 4px;
            background: #eee;
        }

        #summary.pass {
            background: #d7f5dd;
            color: #0b4d1a;
        }

        #summary.fail {
            background: #fbd9d9;
            color: #7a0d0d;
        }

        #filters {
            color: #555;
            margin: .25rem 0 1rem;
        }

        label {
            display: inline-block;
            margin-bottom: .5rem;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1.5rem;
        }

        caption {
            text-align: left;
            font-weight: 600;
            padding: .25rem 0;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: .25rem .5rem;
            text-align: left;
            vertical-align: top;
        }

        tr.pass td:first-child {
            background: #d7f5dd;
            color: #0b4d1a;
            font-weight: 600;
        }

        tr.fail td:first-child {
            background: #fbd9d9;
            color: #7a0d0d;
            font-weight: 600;
        }

        tr.note td:first-child {
            background: #fff1c9;
            color: #6b4b00;
            font-weight: 600;
        }

        td.detail {
            font-family: ui-monospace, Consolas, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        body.only-failures #report tr.pass {
            display: none;
        }

        #stage {
            overflow: auto;
            margin-bottom: 1rem;
        }
    </style>
</head>
<script type="module" src="suite.js" defer></script>
<body>
    <h1>Tests navigateur du portfolio</h1>
    <p id="summary">Chargement de la suite…</p>
    <p id="filters"></p>
    <label><input type="checkbox" id="onlyFailures"> Afficher seulement les échecs</label>
    <div id="stage" aria-label="Site en cours de test"></div>
    <div id="exceptions"></div>
    <div id="report"></div>
</body>
</html>
